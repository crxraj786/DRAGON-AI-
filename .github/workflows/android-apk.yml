name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "api/**"
      - "index.html"
      - "package.json"
      - "vite.config.js"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm install

      - name: Install Capacitor toolchain
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3 sharp

      - name: Run tests and build web app
        env:
          VITE_API_BASE_URL: https://dragon-ai-five.vercel.app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate Dragon launcher icon
        run: |
          mkdir -p assets
          node --input-type=module -e "import sharp from 'sharp'; await sharp('public/dragon-logo.jpg').resize(1024, 1024, { fit: 'contain', background: '#f4f0e6' }).png().toFile('assets/icon-only.png')"
          npx capacitor-assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-ai-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
